# Plumber policy for this repository: the Plumber default policy plus the
# overrides below, nothing else. Every control the default enables runs here,
# including the ones added after this file was first written.
#   plumber config resolve   # prints the full effective policy
#   plumber config diff      # shows these overrides against the default
version: "2.0"
extends: plumber:default

github:
  controls:
    # Third-party actions the chart CI relies on, both pinned through the
    # actions lockfile (.github/workflows/actions.lock); listed so the default
    # source policy authorizes them. Add an entry here before introducing a
    # third-party action that is neither GitHub-official nor from this org.
    githubActionMustComeFromAuthorizedSources:
      trustedGithubActions:
        - d3adb5/helm-unittest-action
        - dorny/test-reporter

    # The chart and compose checks must run on the pinned toolchain actions.
    workflowMustIncludeRequiredActions:
      enabled: true
      required: actions/checkout AND azure/setup-helm AND actions/setup-python
