# Plumber v2 (compose-first, release-process spec, root takeover 2026-08-25).
#
# What this file is: a minimal, working production stack for a single-node
# self-managed install - backend, frontend, Postgres, Redis. No `build:`
# sections (both apps run from the published images), no bundled reverse
# proxy / TLS terminator (see the note on the frontend service below - front
# this stack with your own reverse proxy for a real deployment).
#
# v1 (Helm chart, podman, the old Traefik-in-compose install) still lives,
# unchanged, in legacy-v1/ - see legacy-v1/README.md. This file is the NEW
# v2 line only; the two are not compatible and do not share a database.
#
# Copy .env.example to .env, fill it in (see that file for what every
# variable means and how to generate the secrets), then `docker compose up
# -d`. See the root README.md for the full quick start and the first-run
# bootstrap step.

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PLUMBER_DB_USER}
      POSTGRES_PASSWORD: ${PLUMBER_DB_PASSWORD}
      POSTGRES_DB: ${PLUMBER_DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PLUMBER_DB_USER} -d ${PLUMBER_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: docker.io/getplumber/platform-backend:${PLATFORM_VERSION}
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      # Compose-internal hostnames (postgres/redis are sibling services on
      # this same compose network) - not operator-configurable through
      # .env; edit this file directly if you point at an external DB/Redis
      # instead of the bundled ones above.
      PLUMBER_DB_HOST: postgres
      PLUMBER_DB_PORT: "5432"
      PLUMBER_REDIS_ADDR: redis:6379

      # Required - see .env.example for what each one means and how to
      # generate it.
      PLUMBER_DB_USER: ${PLUMBER_DB_USER}
      PLUMBER_DB_PASSWORD: ${PLUMBER_DB_PASSWORD}
      PLUMBER_DB_NAME: ${PLUMBER_DB_NAME}
      PLUMBER_BASE_URL: ${PLUMBER_BASE_URL}
      PLUMBER_OIDC_AUDIENCE: ${PLUMBER_OIDC_AUDIENCE}
      PLUMBER_OIDC_ALLOWED_ISSUERS: ${PLUMBER_OIDC_ALLOWED_ISSUERS}
      PLUMBER_TOKEN_ENCRYPTION_KEY: ${PLUMBER_TOKEN_ENCRYPTION_KEY}

      # --- Optional hardening knobs, all commented (defaults shown match
      # the backend's own built-in defaults). Uncomment and set in .env,
      # not here, then reference with ${...} the same way as above.
      #
      # Postgres TLS (only meaningful if PLUMBER_DB_HOST points at a real
      # network hop, not the compose-private postgres service above):
      # PLUMBER_DB_SSLMODE: ${PLUMBER_DB_SSLMODE:-disable}       # disable|allow|prefer|require|verify-ca|verify-full
      # PLUMBER_DB_SSLROOTCERT: ${PLUMBER_DB_SSLROOTCERT:-}      # private CA PEM path (verify-ca/verify-full)
      # PLUMBER_DB_SSLCERT: ${PLUMBER_DB_SSLCERT:-}              # client cert PEM path (mutual TLS)
      # PLUMBER_DB_SSLKEY: ${PLUMBER_DB_SSLKEY:-}                # client key PEM path (mutual TLS)
      #
      # Refuse a loopback/private/link-local base_url or SMTP relay by
      # mistake (off by default: on-prem/private GitLab is the common,
      # legitimate case):
      # PLUMBER_BASE_URL_REJECT_PRIVATE: ${PLUMBER_BASE_URL_REJECT_PRIVATE:-false}
      # PLUMBER_REPORT_SMTP_REJECT_PRIVATE_RELAY: ${PLUMBER_REPORT_SMTP_REJECT_PRIVATE_RELAY:-false}
      #
      # Behind a reverse proxy/ingress: trust its X-Forwarded-For hop for
      # the inbound rate limiter's per-IP key (off by default - enabling
      # this without a real proxy in front lets any caller spoof its own
      # rate-limit key):
      # PLUMBER_TRUST_FORWARDED_FOR: ${PLUMBER_TRUST_FORWARDED_FOR:-false}
      # PLUMBER_TRUSTED_PROXY_CIDRS: ${PLUMBER_TRUSTED_PROXY_CIDRS:-}
      #
      # Air-gapped install: stop the daily update-check dial-out entirely:
      # PLUMBER_UPDATE_CHECK_URL: ${PLUMBER_UPDATE_CHECK_URL:-}
      #
      # Once this stack is served over HTTPS (through your own reverse
      # proxy - see the frontend service note below), mark session cookies
      # Secure:
      # PLUMBER_COOKIE_SECURE: ${PLUMBER_COOKIE_SECURE:-false}
      #
      # Runs/snapshots/sync-attempt retention window in days (floor 2):
      # PLUMBER_RETENTION_DAYS: ${PLUMBER_RETENTION_DAYS:-30}
      #
      # Trust an internal CA fronting your GitLab instance (PEM path,
      # mounted below via an added `volumes:` entry on this service):
      # PLUMBER_PROVIDER_CA_BUNDLE: ${PLUMBER_PROVIDER_CA_BUNDLE:-}
    # volumes:
    #   - /path/to/gitlab-ca.pem:/etc/plumber/gitlab-ca.pem:ro   # pair with PLUMBER_PROVIDER_CA_BUNDLE above
    healthcheck:
      # /readyz (db-backed readiness), not /health - see the frontend's own
      # dependency on this healthcheck below.
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/readyz"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    image: docker.io/getplumber/platform-frontend:${PLATFORM_VERSION}
    restart: unless-stopped
    depends_on:
      backend: {condition: service_healthy}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      # Server-side calls (page rendering) reach the backend directly over
      # the compose network - this always works, with or without a reverse
      # proxy in front.
      API_INTERNAL_URL: http://backend:8080/api
    # IMPORTANT: the BROWSER talks to the API at the same origin, under
    # /api (no client-side config, no NEXT_PUBLIC_* - see
    # platform/frontend's own env.ts). This compose file exposes backend
    # and frontend on two SEPARATE host ports, which is fine for local use
    # or if you reach each service directly, but does NOT give the browser
    # one shared origin. For a real deployment, put a reverse proxy in
    # front of both that routes /api/* to backend:8080 and everything else
    # to frontend:3000 on one public hostname (that hostname is
    # PLUMBER_BASE_URL) - and terminate TLS there. This file deliberately
    # does not bundle one (kept minimal, BYO reverse proxy); v1's Traefik
    # setup in legacy-v1/ is a worked reference if you want one.
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  postgres_data:
  redis_data:
