# Plumber Platform v2, production stack (single node, Docker Compose).
#
# Same shape as the v1 stack: Traefik terminates TLS on one origin and routes
# /api to the backend and everything else to the frontend (the browser calls
# the API same-origin, so one hostname is mandatory), Redis and an optional
# bundled Postgres. Configure through .env (see .env.example / install.sh).
# v1 lives unchanged in legacy-v1/. The two lines are not compatible.
name: "plumber"

services:

  ############
  # Plumber  #
  ############

  frontend:
    image: docker.io/getplumber/platform-frontend:${PLATFORM_VERSION}
    restart: unless-stopped
    environment:
      # Server-side rendering calls the backend over the compose network.
      - API_INTERNAL_URL=http://backend:8080/api
      - GITLAB_URL=${GITLAB_URL}
    volumes:
      # Private CA support: every .crt/.pem here is added to Node's trust store
      # by the image entrypoint (NODE_EXTRA_CA_CERTS).
      - ./.docker/ca-certificates:/usr/local/share/ca-certificates:ro
    expose:
      - "3000"
    depends_on:
      - backend
    labels:
      - "traefik.http.routers.front.rule=Host(`${DOMAIN_NAME}`)"
      - "traefik.http.routers.front.entrypoints=websecure"
      - "traefik.http.routers.front.tls=true"
      - "traefik.http.routers.front.tls.certresolver=${CERT_RESOLVER:-}"
      - "traefik.http.services.front.loadbalancer.server.port=3000"
    networks:
      - intranet

  backend:
    # One process: API, background workers, schedulers and database migrations
    # (run on boot). Distroless image, non-root uid 65532, no shell, so there is
    # no in-container healthcheck: probe /healthz and /readyz from outside.
    image: docker.io/getplumber/platform-backend:${PLATFORM_VERSION}
    restart: unless-stopped
    environment:
      - PLUMBER_LISTEN_ADDR=0.0.0.0
      - PLUMBER_LISTEN_PORT=8080
      - PLUMBER_BASE_URL=https://${DOMAIN_NAME}
      - PLUMBER_OIDC_AUDIENCE=https://${DOMAIN_NAME}
      - PLUMBER_OIDC_ALLOWED_ISSUERS=${PLUMBER_OIDC_ALLOWED_ISSUERS:-${GITLAB_URL}}
      - PLUMBER_COOKIE_SECURE=true
      - PLUMBER_TRUST_FORWARDED_FOR=true
      - PLUMBER_TRUSTED_PROXY_CIDRS=${PLUMBER_TRUSTED_PROXY_CIDRS:-}
      - PLUMBER_TOKEN_ENCRYPTION_KEY=${PLUMBER_TOKEN_ENCRYPTION_KEY}
      - PLUMBER_DB_HOST=${PLUMBER_DB_HOST:-postgres}
      - PLUMBER_DB_PORT=${PLUMBER_DB_PORT:-5432}
      - PLUMBER_DB_USER=${PLUMBER_DB_USER:-plumber}
      - PLUMBER_DB_PASSWORD=${PLUMBER_DB_PASSWORD}
      - PLUMBER_DB_NAME=${PLUMBER_DB_NAME:-plumber}
      - PLUMBER_DB_SSLMODE=${PLUMBER_DB_SSLMODE:-disable}
      - PLUMBER_DB_SSLROOTCERT=${PLUMBER_DB_SSLROOTCERT:-}
      - PLUMBER_DB_TIMEZONE=${PLUMBER_DB_TIMEZONE:-UTC}
      - PLUMBER_REDIS_URL=redis://default:${PLUMBER_REDIS_PASSWORD}@redis:6379/0
      - PLUMBER_SESSION_TTL=${PLUMBER_SESSION_TTL:-168h}
      - PLUMBER_LOG_LEVEL=${PLUMBER_LOG_LEVEL:-info}
      - PLUMBER_LOG_FORMAT=${PLUMBER_LOG_FORMAT:-json}
      - PLUMBER_RETENTION_DAYS=${PLUMBER_RETENTION_DAYS:-30}
      - PLUMBER_UPDATE_CHECK_URL=${PLUMBER_UPDATE_CHECK_URL:-}
      - PLUMBER_PROVIDER_CA_BUNDLE=${PLUMBER_PROVIDER_CA_BUNDLE:-}
    volumes:
      - ./.docker/ca-certificates:/usr/local/share/ca-certificates:ro
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
    labels:
      - "traefik.http.routers.api.rule=Host(`${DOMAIN_NAME}`)&&PathPrefix(`/api`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls=true"
      - "traefik.http.routers.api.tls.certresolver=${CERT_RESOLVER:-}"
      - "traefik.http.services.api.loadbalancer.server.port=8080"
    networks:
      - intranet

  #####################
  # External services #
  #####################

  redis:
    image: redis:8.4
    pull_policy: always
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass ${PLUMBER_REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    environment:
      - REDIS_PASSWORD=${PLUMBER_REDIS_PASSWORD}
    expose:
      - "6379"
    labels:
      - "traefik.enable=false"
    networks:
      - intranet

  postgres:
    profiles: ["internal-db"]
    image: postgres:18
    pull_policy: always
    restart: unless-stopped
    volumes:
      # postgres 18 images refuse a mount at /var/lib/postgresql/data; mount one
      # level up and point PGDATA below it (same layout as v1).
      - postgres-data:/var/lib/postgresql
    environment:
      - POSTGRES_USER=${PLUMBER_DB_USER:-plumber}
      - POSTGRES_PASSWORD=${PLUMBER_DB_PASSWORD}
      - POSTGRES_DB=${PLUMBER_DB_NAME:-plumber}
      - PGDATA=/var/lib/postgresql/18/data
    labels:
      - "traefik.enable=false"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -h 127.0.0.1 -p 5432"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    expose:
      - "5432"
    networks:
      - intranet

  #################
  # Reverse proxy #
  #################

  traefik-le:
    profiles: ["letsencrypt"]
    image: traefik:3.6
    pull_policy: always
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    command:
      - --log.level=INFO
      - --accesslog=true
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entryPoint.to=websecure
      - --entrypoints.web.http.redirections.entryPoint.scheme=https
      - --entrypoints.web.http.redirections.entrypoint.permanent=true
      - --entrypoints.websecure.address=:443
      - --providers.docker=true
      - --certificatesresolvers.le.acme.caserver=https://acme-v02.api.letsencrypt.org/directory
      - --certificatesresolvers.le.acme.storage=/acme/acme.json
      - --certificatesresolvers.le.acme.tlschallenge=true
    labels:
      - "traefik.enable=false"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-acme:/acme
    networks:
      - intranet

  traefik-custom-certs:
    profiles: ["custom-certs"]
    image: traefik:3.6
    pull_policy: always
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    command:
      - --log.level=INFO
      - --accesslog=true
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entryPoint.to=websecure
      - --entrypoints.web.http.redirections.entryPoint.scheme=https
      - --entrypoints.web.http.redirections.entrypoint.permanent=true
      - --entrypoints.websecure.address=:443
      - --providers.docker=true
      - --providers.file.filename=/etc/traefik/certs.yml
    labels:
      - "traefik.enable=false"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./.docker/traefik/certs:/certs:ro
      - ./.docker/traefik/certs.yml:/etc/traefik/certs.yml:ro
    networks:
      - intranet

networks:
  intranet:

volumes:
  postgres-data:
  traefik-acme:
