{{- $applications := list .Values.front .Values.backend -}}
{{- range $applications }}
{{- if .enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .name }}
  labels:
    app: {{ .name }}
    app.kubernetes.io/name: {{ .name }}
    {{- include "plumber-platform.labels" $ | nindent 4 }}
  {{- include "plumber-platform.annotations" $ | nindent 2 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: {{ .name }}
    app.kubernetes.io/name: {{ .name }}
{{- end }}
{{- end }}
