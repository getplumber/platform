{{- $needKey := not .Values.platform.existingSecret -}}
{{- $needDb := not .Values.postgresql.global.postgresql.auth.existingSecret -}}
{{- $needRedis := and (not .Values.redis.auth.existingSecret) (ne .Values.redis.auth.password "") -}}
{{- if $needKey }}
{{- $key := required "platform.tokenEncryptionKey is required when platform.existingSecret is empty (openssl rand -hex 32)" .Values.platform.tokenEncryptionKey -}}
{{- if not (regexMatch "^[0-9a-fA-F]{64}$" $key) }}
{{- fail "platform.tokenEncryptionKey must be exactly 64 hex characters (32 bytes, openssl rand -hex 32)" }}
{{- end }}
{{- end }}
{{- if or $needKey $needDb $needRedis }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "plumber-platform.fullname" . }}
  labels:
    {{- include "plumber-platform.labels" . | nindent 4 }}
  {{- include "plumber-platform.annotations" . | nindent 2 }}
type: Opaque
stringData:
  {{- if $needKey }}
  tokenEncryptionKey: {{ .Values.platform.tokenEncryptionKey | quote }}
  {{- end }}
  {{- if $needDb }}
  dbPassword: {{ required "postgresql.global.postgresql.auth.password is required when postgresql.global.postgresql.auth.existingSecret is empty" .Values.postgresql.global.postgresql.auth.password | quote }}
  {{- end }}
  {{- if $needRedis }}
  redisPassword: {{ .Values.redis.auth.password | quote }}
  {{- end }}
{{- end }}
