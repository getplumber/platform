suite: chart-managed secret
templates:
  - secret.yaml
values:
  - ./values/base.yaml
release:
  name: plumber
tests:
  - it: holds the key and both passwords by default
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: plumber-plumber-platform
      - equal:
          path: stringData.tokenEncryptionKey
          value: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      - equal:
          path: stringData.dbPassword
          value: pgpass
      - equal:
          path: stringData.redisPassword
          value: redispass
  - it: is not rendered when every secret is external
    set:
      platform.existingSecret: a
      platform.tokenEncryptionKey: ""
      postgresql.global.postgresql.auth.existingSecret: b
      postgresql.global.postgresql.auth.password: ""
      redis.auth.existingSecret: c
      redis.auth.password: ""
    asserts:
      - hasDocuments:
          count: 0
  - it: rejects a key that is not 64 hex characters
    set:
      platform.tokenEncryptionKey: "0123456789abcdef0123456789abcdef"
    asserts:
      - failedTemplate:
          errorPattern: 64 hex
  - it: requires a key when no existing secret is given
    set:
      platform.tokenEncryptionKey: ""
    asserts:
      - failedTemplate:
          errorPattern: platform.tokenEncryptionKey
